name: Refresh Pokemon deals

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4,10,16,22 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_direct_links.py'
      - 'scripts/update_catalog.py'
      - 'scripts/update_pulls.py'
      - 'scripts/validate_pulls.py'
      - 'scripts/upgrade_top_pulls_ui.py'
      - 'data/pulls.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: pokedeals-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Install ranked Top Pulls UI
        run: python scripts/upgrade_top_pulls_ui.py

      - name: Normalize vendor links to direct product pages
        run: python scripts/normalize_direct_links.py

      - name: Refresh known direct product listings
        run: python scripts/update_catalog.py

      - name: Rebuild exact Top Pulls from TCGdex + Cardmarket AVG7
        run: python scripts/update_pulls.py

      - name: Validate pull prices, ranks and exact card images
        run: python scripts/validate_pulls.py

      - name: Validate JSON
        run: |
          python -m json.tool data/catalog.json > /dev/null
          python -m json.tool data/pulls.json > /dev/null

      - name: Commit changed site and data
        run: |
          if git diff --quiet -- index.html data/catalog.json data/pulls.json; then
            echo "No site/data changes"
            exit 0
          fi
          git config user.name "Colinskis PokeDeals Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/catalog.json data/pulls.json
          git commit -m "chore: refresh PokeDeals site and data"
          git push
