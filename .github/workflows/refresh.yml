name: Refresh Pokemon deals

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4,10,16,22 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_direct_links.py'
      - 'scripts/update_catalog.py'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: pokedeals-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Normalize vendor links to direct product pages
        run: python scripts/normalize_direct_links.py

      - name: Refresh known direct product listings
        run: python scripts/update_catalog.py

      - name: Validate catalog JSON
        run: python -m json.tool data/catalog.json > /dev/null

      - name: Commit changed catalog
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "Colinskis PokeDeals Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore: refresh Pokemon deal data"
          git push
